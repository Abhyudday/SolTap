[package]
name = "arcium-private-payments"
version = "0.1.0"
description = "Arcium-powered private payment processor for merchant transactions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arcium_private_payments"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
arcium-anchor = "0.3.0"
arcis = "0.3.0"

[dev-dependencies]
solana-program-test = "1.17.0"
solana-sdk = "1.17.0"
tokio = "1.35.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
